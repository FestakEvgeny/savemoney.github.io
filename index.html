<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal & policies</title>
    <!-- Simple, clean styling for clarity -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f9fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            line-height: 1.5;
            color: #1e293b;
        }

        .card {
            max-width: 640px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.1), 0 8px 12px -4px rgba(0, 0, 0, 0.05);
            padding: 2.5rem 2rem;
            transition: box-shadow 0.2s;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #0f172a;
            margin-bottom: 2rem;
            text-align: center;
            border-bottom: 2px solid #e9eef3;
            padding-bottom: 1rem;
        }

        .policy-list {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .policy-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .policy-title {
            font-size: 1.35rem;
            font-weight: 600;
            color: #0f172a;
            margin: 0;
        }

        .policy-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.1rem;
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
            padding: 0.6rem 0.9rem;
            background: #f1f5f9;
            border-radius: 12px;
            transition: background 0.2s, color 0.2s, transform 0.1s;
            width: fit-content;
            border: 1px solid transparent;
        }

        .policy-link:hover {
            background: #e2e8f0;
            color: #1d4ed8;
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        .policy-link:active {
            transform: translateY(0);
            background: #cbd5e1;
        }

        /* subtle arrow indicator (optional) */
        .policy-link::after {
            content: "→";
            font-size: 1rem;
            opacity: 0.7;
            transition: transform 0.2s;
        }

        .policy-link:hover::after {
            transform: translateX(3px);
            opacity: 1;
        }

        .footnote {
            margin-top: 2.5rem;
            text-align: center;
            font-size: 0.875rem;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
            padding-top: 1.5rem;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .card {
                padding: 1.75rem 1.25rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .policy-title {
                font-size: 1.2rem;
            }

            .policy-link {
                font-size: 1rem;
                width: 100%;
                justify-content: space-between;
            }

            .policy-link::after {
                content: "→";
                margin-left: auto;
            }
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Legal & policies</h1>

        <div class="policy-list">
            <!-- Privacy Policy section -->
            <div class="policy-item">
                <div class="policy-title">Privacy Policy</div>
                <a href="privacy.html" class="policy-link" aria-label="Navigate to privacy policy">
                    Privacy Policy
                </a>
            </div>

            <!-- Terms and Conditions section -->
            <div class="policy-item">
                <div class="policy-title">Terms and Conditions</div>
                <a href="terms-of-use.html" class="policy-link" aria-label="Navigate to terms and conditions">
                    Terms and Conditions
                </a>
            </div>
        </div>

        <div class="footnote">
            Click any link to read the full document.
        </div>
    </main>
</body>
</html>
